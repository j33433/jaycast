      <main>
        <h1>jaycast</h1>
        <p>
          Weather-informed rideability forecasts for South Florida MTB trails:
          Camp Murphy (Jonathan Dickinson State Park), Markham Park (Weston),
          and Quiet Waters Park (Deerfield Beach).
        </p>
        <h2>Camp Murphy MTB Trails</h2>
        <p>
          Sandy scrub trails at Jonathan Dickinson State Park, FL. Rides best
          about 18 hours after meaningful rain, once the sand firms up and
          before the sun dries it back. A long dry spell leaves the sugar sand
          loose and slow.
          <a href="https://upload.bike/jaycast/?camp-murphy">Camp Murphy forecast</a>
        </p>
        <h2>Markham Park Mountain Bike Trails</h2>
        <p>
          Dirt and gravel trails at Markham Park, Weston, FL that drain slowly.
          Estimate 8.5 hours after rain ends, plus 8 hours per additional inch,
          capped at 18.5 hours. Heavy afternoon rain can push reopening to the
          next midday.
          <a href="https://upload.bike/jaycast/?markham">Markham forecast</a>
        </p>
        <h2>Quiet Waters Park Mountain Bike Trails</h2>
        <p>
          Mixed hardpack trails at Quiet Waters Park, Deerfield Beach, FL that
          stay fast even when dry. Rain only temporarily degrades the surface;
          mud clears within about 14 hours.
          <a href="https://upload.bike/jaycast/?quiet-waters">Quiet Waters forecast</a>
        </p>
